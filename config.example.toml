# Global LLM configuration
[llm]
model = "qwen-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "sk-YOUR_API_KEY_HERE"
max_tokens = 4096
temperature = 0.0

# Global database configuration
[database]
host = "127.0.0.1"
port = 3306
user = "root"
password = "your_password"
database = "exp_data"
charset = "utf8mb4"

# Module-specific database configurations (optional, inherit from global [database] if not specified)
# Uncomment and modify these sections if a module needs a different database
#
# [learning_database]
# host = "127.0.0.1"
# port = 3306
# user = "root"
# password = "your_password"
# database = "exp_data"
# charset = "utf8mb4"
#
# [generating_database]
# host = "127.0.0.1"
# port = 3306
# user = "root"
# password = "your_password"
# database = "exp_data"
# charset = "utf8mb4"
#
# [generating_output_database]
# host = "127.0.0.1"
# port = 3306
# user = "root"
# password = "your_password"
# database = "exp_data"
# charset = "utf8mb4"
#
# [reasoning_database]
# host = "127.0.0.1"
# port = 3306
# user = "root"
# password = "your_password"
# database = "exp_data"
# charset = "utf8mb4"
# table = "experiments_data_daily"
#
# [reasoning_output_database]
# host = "127.0.0.1"
# port = 3306
# user = "root"
# password = "your_password"
# database = "exp_data"
# charset = "utf8mb4"
# table = "report_optimised"

# LLM vision configuration
[llm.vision]
model = "qwen-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "sk-YOUR_API_KEY_HERE"
max_tokens = 4096
temperature = 0.0

# Runflow configuration
[runflow]
use_data_analysis_agent = false

# Learning module LLM configuration
[learning_llm]
model = "qwen-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "sk-YOUR_API_KEY_HERE"
max_tokens = 4096
temperature = 0.0

# Generating module LLM configuration
[generating_llm]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
dashscope_api_key = "sk-YOUR_API_KEY_HERE"
dashscope_model = "qwen-plus"
deepseek_api_key = "sk-YOUR_DEEPSEEK_API_KEY_HERE"
deepseek_base_url = "https://api.deepseek.com/v1/chat/completions"
deepseek_model = "deepseek-reasoner"
temperature = 0.7
timeout = 120

# Generating module generation configuration
[generating_generation]
total_runs = 15
max_workers = 10

# RecipeQA LLM configuration
[recipeqa_llm]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
dashscope_api_key = "sk-YOUR_API_KEY_HERE"
dashscope_model = "qwen-plus"
temperature = 0.4
timeout = 60

# Fine-tuning module API configuration
[finetuning_api]
base_url = "http://localhost:8000"
timeout = 60
base_model_path = "/path/to/base-model/"
dpo_train_config_template = "/path/to/train_config_example.yaml"
inference_config_template = "/path/to/test_config_example.yaml"

# Reasoning module LLM configuration
[reasoning_llm]
base_url = "http://localhost:8000"
dashscope_api_key = "sk-YOUR_API_KEY_HERE"
dashscope_model = "qwen-plus"
temperature = 0.7
timeout = 120

# Reasoning module generation configuration
[reasoning_generation]
total_runs = 15
max_workers = 10

# Evaluation module LLM configuration
[evaluation_llm]
deepseek_api_key = "sk-YOUR_DEEPSEEK_API_KEY_HERE"
deepseek_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
deepseek_model = "deepseek-r1"
qwen_api_key = "sk-YOUR_API_KEY_HERE"
qwen_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
qwen_model = "qwen-max"
gpt5_api_key = "sk-YOUR_GPT5_API_KEY_HERE"
gpt5_base_url = "https://api.openai.com/v1/"
gpt5_model = "gpt-5"
default_llm_key = "qwen"

# Evaluation module predictor configuration
[evaluation_predictor]
base_model_dir = "data/predictor_inputs"

# Evaluation module configuration
[evaluation]
compound_mapping = "data/compound_mapping.json"
materials_dict = "data/materials_dict_2025_11_11.pickle"
rubric_path = "data/five_dimension_rubrics_new_zhao.json"

recipe_indicators = [
    "recipe_integrity",
    "formula_rationality",
    "parameter_rationality",
    "performance_rationality",
    "recipe_recommendation",
    "experimental_validation"
]
mechanism_indicators = [
    "domain_knowledge",
    "mechanism_integrity",
    "mechanism_interpretation",
    "mechanism_comprehensiveness",
    "mechanism_coherence"
]

recipe_custom = [
    "recipe_integrity",
    "formula_rationality",
    "parameter_rationality",
    "recipe_recommendation"
]
mechanism_custom = [
    "domain_knowledge",
    "mechanism_integrity",
    "mechanism_interpretation",
    "mechanism_comprehensiveness",
    "mechanism_coherence"
]

[evaluation.indicator_weight]
recipe_integrity = 0.05
formula_rationality = 0.05
parameter_rationality = 0.05
performance_rationality = 0
recipe_recommendation = 0
experimental_validation = 0.35
domain_knowledge = 0.1
mechanism_integrity = 0.1
mechanism_interpretation = 0.1
mechanism_comprehensiveness = 0.1
mechanism_coherence = 0.1

system_prompt = """
You are an expert reviewer of perovskite-solar-cell research papers and a strict but fair grader.

Your task:
- Read a JSON rubric and a JSON object containing one model-generated report.
- Assign integer scores and short comments for each rubric dimension.
- Follow the rubric exactly and be slightly conservative.
- Respond ONLY with a single valid JSON object, with no markdown and no extra text.
"""

# DeepSeek configuration
[deepseek]
api_key = "sk-YOUR_DEEPSEEK_API_KEY_HERE"
base_url = "https://api.deepseek.com/v1/chat/completions"
model = "deepseek-reasoner"
temperature = 0.3
timeout = 120

# Optimization module API configuration
[optimization_api]
base_url = "http://localhost:8000"
timeout = 60
base_model_path = "/path/to/base-model/"
dpo_train_config_template = "/path/to/train_config_example.yaml"
inference_config_template = "/path/to/test_config_example.yaml"

# Optimization module LLM configuration
[optimization_llm]
base_url = "http://localhost:13338/v1/chat/completions"
model = "qwen3-32b"
temperature = 0.7
