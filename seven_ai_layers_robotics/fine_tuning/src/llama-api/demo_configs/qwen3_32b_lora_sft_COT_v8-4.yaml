### model
model_name_or_path: /data/LLM_Base_Model/Qwen3-32B/
trust_remote_code: true
flash_attn: fa2  

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: exp_data_single_var_v7_0, exp_data_optimized_v7_0, exp_data_single_var_v7_1, exp_data_optimized_v7_1, exp_data_single_var_v7_2, exp_data_optimized_v7_2, exp_data_single_var_v7_5, exp_data_optimized_v7_5, exp_data_single_var_v7_6, exp_data_optimized_v7_6
template: qwen3
cutoff_len: 3072
packing: true
mix_strategy: interleave_over
max_samples: 10000000000
overwrite_cache: true
preprocessing_num_workers: 32


### output
output_dir: /data/LLM_lora_SFT/saves/qwen3_32b_v8-4/lora/sft
logging_steps: 1000
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 9.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
# resume_from_checkpoint: true

### eval
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100
